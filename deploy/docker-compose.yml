# MSP Atlas: app + PostgreSQL + Caddy (automatic HTTPS).
# Usage: cp .env.example .env, edit it, then from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
name: atlas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
    image: msp-atlas:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://atlas:${POSTGRES_PASSWORD}@db:5432/atlas
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      ATLAS_MASTER_KEY: ${ATLAS_MASTER_KEY:?Set ATLAS_MASTER_KEY in .env}
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - data:/data
    expose:
      - '4318'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:?Set ATLAS_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  data:
  caddy_data:
  caddy_config:
