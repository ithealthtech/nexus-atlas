name: Release

# Publishes the version in package.json: the Docker image goes to GitHub Container Registry, and a ready-to-run
# Windows package and the Atlas for Windows setup program are attached to a GitHub release with that version's
# changelog. Start it either by pushing a tag
# such as v1.0.1, or from the Actions tab (Run workflow on main), which creates the tag on that commit.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two runs can never publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version."
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release from main, not $GITHUB_REF_NAME."
              exit 1
            fi
            # Claim the tag before anything is built. The push is refused if the tag already exists, so a
            # version is only ever built from one commit. Tags pushed with GITHUB_TOKEN start no other runs.
            if ! git push origin "$GITHUB_SHA:refs/tags/$tag"; then
              echo "::error::$tag already exists. Bump the version in package.json first."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.check.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    name: Windows package
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm prune --omit=dev --no-audit --no-fund
      # The same files as the Docker image, plus the installer and the docs.
      - name: Package
        shell: pwsh
        run: |
          $name = "msp-atlas-${{ needs.check.outputs.version }}-windows"
          $out = Join-Path $env:RUNNER_TEMP $name
          $items = @(
            'package.json', 'package-lock.json', 'node_modules', 'README.md', 'CHANGELOG.md', 'SECURITY.md', 'docs', 'deploy',
            'packages/shared/package.json', 'packages/shared/dist',
            'packages/db/package.json', 'packages/db/dist', 'packages/db/drizzle',
            'apps/server/package.json', 'apps/server/dist', 'apps/server/report-fonts',
            'apps/web/package.json', 'apps/web/dist'
          )
          foreach ($item in $items) {
            $target = Join-Path $out $item
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item -Recurse -Path $item -Destination $target
          }
          Compress-Archive -Path "$out\*" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: msp-atlas-*-windows.zip*

  # The desktop app's setup program. Every release carries it under the same file name, so
  # releases/latest/download/AtlasForWindowsSetup.exe always works; the app has its own version number
  # (apps/windows/Directory.Build.props), which only changes when the app does.
  #
  # Signed with Azure Artifact Signing when it's set up (docs/CODE-SIGNING.md): the repository variable
  # ARTIFACT_SIGNING_ACCOUNT, with ARTIFACT_SIGNING_ENDPOINT and ARTIFACT_SIGNING_PROFILE, and the secrets
  # AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID for an identity GitHub signs in as (OpenID Connect, no
  # stored password). The app's own files are signed before they go into the setup program, then the setup program
  # itself, then its checksum is taken. Without it, the release is built unsigned, as before.
  client:
    name: Atlas for Windows
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    # Azure trusts this environment's runs (and nothing else in the repository) to sign.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      SIGN: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build the app
        shell: pwsh
        run: apps/windows/build-installer.ps1 -Step publish
      - name: Sign in to Azure
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the app
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\apps\windows\dist\app\AtlasForWindows.exe
            ${{ github.workspace }}\apps\windows\dist\app\AtlasForWindows.dll
            ${{ github.workspace }}\apps\windows\dist\app\Atlas.Windows.Core.dll
            ${{ github.workspace }}\apps\windows\dist\app-arm64\AtlasForWindows.exe
            ${{ github.workspace }}\apps\windows\dist\app-arm64\AtlasForWindows.dll
            ${{ github.workspace }}\apps\windows\dist\app-arm64\Atlas.Windows.Core.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build the setup program
        shell: pwsh
        run: apps/windows/build-installer.ps1 -Step setup
      - name: Sign the setup program
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\apps\windows\dist\AtlasForWindowsSetup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Signing changes the file, so the checksum is taken again; and a signed release must really be signed.
      - name: Check the signature and take the checksum
        shell: pwsh
        run: |
          $setup = 'apps/windows/dist/AtlasForWindowsSetup.exe'
          $signature = Get-AuthenticodeSignature $setup
          if ($env:SIGN -eq 'true' -and $signature.Status -ne 'Valid') { throw "The setup program isn't validly signed: $($signature.StatusMessage)" }
          if ($env:SIGN -ne 'true') { Write-Host '::warning::Atlas for Windows is unsigned: code signing is not set up (docs/CODE-SIGNING.md).' }
          else { Write-Host "Signed by $($signature.SignerCertificate.Subject)" }
          apps/windows/build-installer.ps1 -Step checksum
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            apps/windows/dist/AtlasForWindowsSetup.exe
            apps/windows/dist/AtlasForWindowsSetup.exe.sha256

  release:
    name: GitHub release
    needs: [check, docker, windows, client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
      - name: Release notes from the changelog
        run: |
          awk -v v="${{ needs.check.outputs.version }}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          **Docker:** \`ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.check.outputs.version }}\`
          **Windows:** download the zip below, extract it to a folder such as \`C:\\Program Files\\MSP Atlas\`, and run \`deploy\\windows\\Install-Atlas.ps1\` (see docs/DEPLOYMENT.md).
          **Atlas for Windows** (the desktop app for technicians): run \`AtlasForWindowsSetup.exe\` below. It installs for the person running it, without administrator rights.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: MSP Atlas ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: |
            msp-atlas-*-windows.zip
            msp-atlas-*-windows.zip.sha256
            AtlasForWindowsSetup.exe
            AtlasForWindowsSetup.exe.sha256
