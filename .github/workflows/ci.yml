name: CI

on:
  push:
    # main, and release branches such as release/2.0 that collect a major release's work before it ships.
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      # Fails when copied code passes 1% of the source, and lists every copy it found for the review.
      - run: npm run duplicates
      - run: node scripts/build-site.mjs --check
      - run: npm run build
      - run: npm run build:extension
      - run: npm run typecheck
      # A real Caddy acting as its own certificate authority, which is what the installer sets up for an address
      # with no public name. The Certificate page's tests then read a real connection and Caddy's real admin API.
      # It runs as the build's own user, so it is told to leave port 80 (the redirect to HTTPS) alone.
      - name: Caddy with its own certificate authority
        run: |
          curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -yq caddy
          sudo systemctl disable --now caddy
          printf '{\n\tskip_install_trust\n\tauto_https disable_redirects\n}\n127.0.0.1:8443 {\n\ttls internal\n\trespond "ok"\n}\n' > "$RUNNER_TEMP/Caddyfile"
          caddy start --config "$RUNNER_TEMP/Caddyfile" --adapter caddyfile
          # What Caddy's admin address answers, for anyone reading a failed run.
          sleep 1
          curl -s -o /dev/null -w 'curl: HTTP %{http_code}\n' http://127.0.0.1:2019/pki/ca/local || true
          curl -s http://127.0.0.1:2019/pki/ca/local | head -c 300 || true; echo
      - run: npm test
        env:
          ATLAS_TEST_CADDY: https://127.0.0.1:8443
      - run: npm audit --omit=dev --audit-level=high

  # The oldest supported Node.js and PostgreSQL run in the job above; this proves the newest LTS of each works too.
  newer-runtimes:
    name: Unit tests on Node.js 24 and PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:extension
      - run: npm test

  # Runs beside the checks above instead of after them: the browser tests are the slow part.
  e2e:
    name: End-to-end (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/atlas_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/**/*.png
            test-results/**/*.pdf
            test-results/**/trace.zip
            test-results/**/error-context.md
          retention-days: 7

  # The clickable demo needs no server or database, so every page is checked in both themes and at phone width.
  demo:
    name: Accessibility and screenshots (demo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @atlas/shared
      - run: npm run build:demo -w @atlas/web
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test -c playwright.demo.config.ts
      # The reference images, including any this run had to take, ready to commit to e2e/demo/screenshots.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screenshots
          path: e2e/demo/screenshots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-report
          path: |
            playwright-report-demo
            test-results/demo
          retention-days: 7

  windows:
    name: Build and unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # Database-backed tests run on Linux; these cover crypto, key files, and configuration on Windows.
      - run: npx vitest run apps/server/test/keys.test.ts
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($script in 'deploy/windows/Install-Atlas.ps1', 'deploy/rmm/Invoke-AtlasPasswordRotation.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$script", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "${script}: $_" }; exit 1 }
          }

  # The Windows server installer, run for real in Windows PowerShell 5.1 against the runner's own PostgreSQL: a first
  # install at this server's own address, an update that keeps it, a domain behind a proxy, back again, uninstall.
  windows-installer:
    name: Windows server installer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Demo recorder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\demo" | Out-Null
          # Opens an address in Edge, which uses this server's trusted certificates, and saves what it shows.
          @'
          const { chromium } = require('@playwright/test');
          const [url, file] = process.argv.slice(2);
          (async () => {
            const browser = await chromium.launch({ channel: 'msedge' });
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.screenshot({ path: file });
            console.log(`${url} -> "${await page.title()}"`);
            await browser.close();
          })().catch((e) => { console.error(e.message); process.exit(1); });
          '@ | Set-Content "$env:GITHUB_WORKSPACE\demo-shot.cjs"
      - name: PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service postgresql* | Select-Object -First 1
          Set-Service $service.Name -StartupType Manual
          Start-Service $service.Name
          & "$env:PGBIN\psql.exe" -c "create role atlas login password 'atlas-ci'" -c 'create database atlas owner atlas'
          if ($LASTEXITCODE) { exit 1 }
      - name: First install, at this server's own address
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\deploy\windows\Install-Atlas.ps1 -DatabaseUrl 'postgres://atlas:atlas-ci@127.0.0.1:5432/atlas' *>&1 |
            Tee-Object "$env:RUNNER_TEMP\demo\1-first-install.txt"
          $settings = Get-Content "$env:ProgramData\MSP Atlas\atlas.env"
          $settings -replace '(PASSPHRASE|DATABASE_URL)=.*', '$1=(hidden)' | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\demo\1-atlas.env.txt"
          $url = ($settings | Where-Object { $_ -like 'PUBLIC_URL=*' }).Substring(11)
          node "$env:GITHUB_WORKSPACE\demo-shot.cjs" $url "$env:RUNNER_TEMP\demo\1-atlas-at-lan-address.png"
          if ($LASTEXITCODE) { throw 'Edge could not open Atlas.' }
          if ($url -notmatch '^https://\d+\.\d+\.\d+\.\d+:4318$') { throw "Unexpected address: $url" }
          if ($settings -notcontains 'HOST=0.0.0.0') { throw 'Atlas should listen on the network.' }
          # Trusted on this server: no certificate warning.
          if ((Invoke-WebRequest "$url/readyz" -UseBasicParsing).StatusCode -ne 200) { throw 'Not ready.' }
          if (-not (Get-NetFirewallRule -DisplayName 'MSP Atlas (HTTPS)' -ErrorAction SilentlyContinue)) { throw 'No firewall rule.' }
          if (-not (Test-Path .\atlas-local-certificate.cer)) { throw 'No certificate for other computers.' }
          (Get-ChildItem Cert:\LocalMachine\Root | Where-Object FriendlyName -eq 'MSP Atlas (local address)').Thumbprint |
            Set-Content "$env:RUNNER_TEMP\thumbprint.txt"
      - name: Running it again keeps the address and certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\deploy\windows\Install-Atlas.ps1 *>&1 | Tee-Object "$env:RUNNER_TEMP\demo\2-run-again.txt"
          # A re-run shouldn't print errors from the service wrapper.
          if (Select-String -Path "$env:RUNNER_TEMP\demo\2-run-again.txt" -Pattern 'FATAL|Unknown command' -Quiet) { throw 'The service wrapper reported an error.' }
          $now = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object FriendlyName -eq 'MSP Atlas (local address)').Thumbprint
          if ($now -ne (Get-Content "$env:RUNNER_TEMP\thumbprint.txt")) { throw 'The certificate was replaced.' }
      - name: A domain, served by a reverse proxy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\deploy\windows\Install-Atlas.ps1 -PublicUrl https://atlas.example.test *>&1 |
            Tee-Object "$env:RUNNER_TEMP\demo\3-given-a-domain.txt"
          $settings = Get-Content "$env:ProgramData\MSP Atlas\atlas.env"
          $settings -replace '(PASSPHRASE|DATABASE_URL)=.*', '$1=(hidden)' | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\demo\3-atlas.env.txt"
          foreach ($line in 'HOST=127.0.0.1', 'PUBLIC_URL=https://atlas.example.test', 'TRUST_PROXY=true') {
            if ($settings -notcontains $line) { throw "Missing $line" }
          }
          if ($settings -like 'ATLAS_TLS_*') { throw 'The local certificate is still configured.' }
          if (Get-NetFirewallRule -DisplayName 'MSP Atlas (HTTPS)' -ErrorAction SilentlyContinue) { throw 'The firewall rule is still there.' }
          if (Get-ChildItem Cert:\LocalMachine\Root | Where-Object FriendlyName -eq 'MSP Atlas (local address)') { throw 'Still trusted.' }
      - name: Back to this server's own address, then uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\deploy\windows\Install-Atlas.ps1 -LocalAddress auto *>&1 | Tee-Object "$env:RUNNER_TEMP\demo\4-back-to-lan-address.txt"
          $url = ((Get-Content "$env:ProgramData\MSP Atlas\atlas.env") | Where-Object { $_ -like 'PUBLIC_URL=*' }).Substring(11)
          if ((Invoke-WebRequest "$url/readyz" -UseBasicParsing).StatusCode -ne 200) { throw 'Not ready.' }
          node "$env:GITHUB_WORKSPACE\demo-shot.cjs" $url "$env:RUNNER_TEMP\demo\4-atlas-back-at-lan-address.png"
          .\deploy\windows\Install-Atlas.ps1 -Uninstall *>&1 | Tee-Object "$env:RUNNER_TEMP\demo\5-uninstall.txt"
          if (Get-Service MSPAtlas -ErrorAction SilentlyContinue) { throw 'The service is still there.' }
          if (Get-NetFirewallRule -DisplayName 'MSP Atlas (HTTPS)' -ErrorAction SilentlyContinue) { throw 'The firewall rule is still there.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-demo
          path: ${{ runner.temp }}/demo
      - name: Service log
        if: failure()
        shell: pwsh
        run: Get-ChildItem "$env:ProgramData\MSP Atlas\logs" -Filter *.log | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 60 }

  # Atlas for Windows (apps/windows): the core library's tests, the WinUI app itself (which only builds on Windows),
  # and its setup program, built the way a release builds it and then run for real.
  windows-client:
    name: Windows client
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test apps/windows/tests/Atlas.Windows.Core.Tests
      - run: dotnet build apps/windows/src/Atlas.Windows -c Release -p:Platform=x64
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      # In the same steps a release takes, where it signs in between (docs/CODE-SIGNING.md).
      - name: Build the app
        shell: pwsh
        run: apps/windows/build-installer.ps1 -Step publish
      - name: Build the setup program
        shell: pwsh
        run: apps/windows/build-installer.ps1 -Step setup
      # Compiling says nothing about whether the window loads or setup can replace a running copy, so do it: the
      # app's self-test, a first install, an upgrade over a running copy, and an uninstall.
      - name: Install, upgrade, and uninstall
        shell: pwsh
        run: apps/windows/installer/Test-Setup.ps1
      # How the window looks, with made-up data, so a change can be checked without installing it. Each page is also
      # checked with Axe.Windows (Accessibility Insights' engine); a problem fails the job.
      - name: Accessibility scanner
        run: dotnet build apps/windows/tools/AccessibilityScan -c Release -o apps/windows/dist/scanner
      - name: Screenshots and accessibility
        shell: pwsh
        run: apps/windows/Take-Screenshots.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-for-windows-screenshots
          path: apps/windows/dist/screenshots
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-for-windows-setup
          path: |
            apps/windows/dist/AtlasForWindowsSetup.exe
            apps/windows/dist/AtlasForWindowsSetup.exe.sha256
          retention-days: 30
      # The app itself, unpacked, to try a pull request without installing it: AtlasForWindows.exe --preview opens it
      # beside an installed copy, with made-up data, saving nothing.
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-for-windows-app
          path: apps/windows/dist/app
          retention-days: 7

  # The root helper's service actions (deploy/linux/atlas-updater.sh), run against real systemd with stand-ins for
  # Atlas and its web proxy: restarts, a repair, refusals, and reading service states from inside Atlas's sandbox.
  linux-helper:
    name: Linux service helper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo CI=true bash deploy/linux/test-services.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: msp-atlas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
