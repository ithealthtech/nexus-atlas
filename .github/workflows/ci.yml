name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run build
      - run: npm run build:extension
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Legacy 0.2 suite (kept until the M3 data migration)
        run: npm run legacy:test

  # Runs beside the checks above instead of after them: the browser tests are the slow part.
  e2e:
    name: End-to-end (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/atlas_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  windows:
    name: Build and unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # Database-backed tests run on Linux; these cover crypto, key files, and configuration on Windows.
      - run: npx vitest run apps/server/test/keys.test.ts
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($script in 'deploy/windows/Install-Atlas.ps1', 'deploy/rmm/Invoke-AtlasPasswordRotation.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$script", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "${script}: $_" }; exit 1 }
          }

  # Atlas for Windows (apps/windows): the core library's tests, then the WinUI app itself, which only builds on Windows.
  windows-client:
    name: Windows client
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test apps/windows/tests/Atlas.Windows.Core.Tests
      - run: dotnet build apps/windows/src/Atlas.Windows -c Release -p:Platform=x64
      # A preview anyone can try without installing a certificate: unpackaged and self-contained (no .NET or
      # Windows App SDK install needed). Signed MSIX packages come from the release workflow once signing is set up.
      - name: Preview build
        shell: pwsh
        run: |
          dotnet publish apps/windows/src/Atlas.Windows -c Release -r win-x64 -p:Platform=x64 `
            -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true --self-contained true -o preview
          Compress-Archive -Path preview/* -DestinationPath AtlasForWindows-preview-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-for-windows-preview-x64
          path: AtlasForWindows-preview-x64.zip
          retention-days: 30

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: msp-atlas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
